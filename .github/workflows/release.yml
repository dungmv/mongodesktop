name: Release - Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-latest

    env:
      SCHEME: MongoDesktop
      PROJECT: MongoDesktop.xcodeproj
      BUNDLE_ID: com.dungmv.mongodesktop.MongoDesktop
      APP_NAME: MongoDesktop

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7

      # ──────────────────────────────────────────────
      # 2. Select Xcode
      # ──────────────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      # ──────────────────────────────────────────────
      # 3. Extract version from tag  (v1.2.3 → 1.2.3)
      # ──────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────
      # 4. Build & Archive
      # ──────────────────────────────────────────────
      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme   "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS="x86_64" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      # ──────────────────────────────────────────────
      # 5. Export .app from archive
      # ──────────────────────────────────────────────
      - name: Export app
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" "$RUNNER_TEMP/export/"

      # ──────────────────────────────────────────────
      # 6. Create DMG with hdiutil
      # ──────────────────────────────────────────────
      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH=$(uname -m)
          DMG_NAME="${APP_NAME}-${ARCH}.dmg"

          # Prepare staging folder
          STAGING_DIR="$RUNNER_TEMP/dmg_staging"
          mkdir -p "$STAGING_DIR"
          cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          # Create DMG via native hdiutil
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "$RUNNER_TEMP/$DMG_NAME"

          echo "dmg_path=$RUNNER_TEMP/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME"               >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────
      # 7. Create GitHub Release & upload DMG
      # ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Mongo Desktop ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Mongo Desktop ${{ steps.version.outputs.version }}

            ### Installation
            1. Download **${{ steps.dmg.outputs.dmg_name }}** below
            2. Open the DMG and drag **Mongo Desktop** to your Applications folder
            3. Launch from Applications

            > **macOS requirement**: macOS 26.0 or later (Apple Silicon)
          files: ${{ steps.dmg.outputs.dmg_path }}
