name: Release - Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-latest

    env:
      SCHEME: MongoDesktop
      PROJECT: MongoDesktop.xcodeproj
      BUNDLE_ID: com.dungmv.mongodesktop.MongoDesktop
      APP_NAME: MongoDesktop

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7

      # ──────────────────────────────────────────────
      # 2. Select Xcode
      # ──────────────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      # ──────────────────────────────────────────────
      # 3. Install mongo-c-driver via Homebrew
      #    (needed for header / lib search paths)
      # ──────────────────────────────────────────────
      - name: Install mongo-c-driver
        run: brew install mongo-c-driver

      # ──────────────────────────────────────────────
      # 4. Extract version from tag  (v1.2.3 → 1.2.3)
      # ──────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="pr-${{ github.event.number || 'test' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────
      # 5. Build & Archive
      # ──────────────────────────────────────────────
      - name: Build archive
        run: |
          MONGO_INCLUDE=$(brew --prefix mongo-c-driver)/include
          MONGO_LIB=$(brew --prefix mongo-c-driver)/lib

          # Find versioned include subdirs
          MONGOC_INCLUDE=$(ls -d "$MONGO_INCLUDE"/mongoc-* 2>/dev/null | head -1)
          BSON_INCLUDE=$(ls -d "$MONGO_INCLUDE"/bson-* 2>/dev/null | head -1)

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme   "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS="x86_64" \
            HEADER_SEARCH_PATHS="\$(inherited) $MONGOC_INCLUDE $BSON_INCLUDE" \
            LIBRARY_SEARCH_PATHS="\$(inherited) $MONGO_LIB" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # ──────────────────────────────────────────────
      # 6. Export .app from archive
      # ──────────────────────────────────────────────
      - name: Export app
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" "$RUNNER_TEMP/export/"

      # ──────────────────────────────────────────────
      # 7. Create DMG with create-dmg
      # ──────────────────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${APP_NAME}-${VERSION}.dmg"
          APP_PATH="$RUNNER_TEMP/export/$APP_NAME.app"

          create-dmg \
            --volname "$APP_NAME $VERSION" \
            --volicon "$APP_NAME/Assets.xcassets/AppIcon.appiconset/AppIcon-512.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "$APP_NAME.app" 190 160 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 470 160 \
            "$RUNNER_TEMP/$DMG_NAME" \
            "$APP_PATH" \
          || true   # create-dmg exits 1 even on success when no signing

          echo "dmg_path=$RUNNER_TEMP/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME"               >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────
      # 8. Sign the DMG
      # ──────────────────────────────────────────────
      # - name: Sign DMG
      #   run: |
      #     codesign --force --sign - \
      #       "${{ steps.dmg.outputs.dmg_path }}"

      # ──────────────────────────────────────────────
      # 9. Create GitHub Release & upload DMG
      # ──────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Mongo Desktop ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Mongo Desktop ${{ steps.version.outputs.version }}

            ### Installation
            1. Download **${{ steps.dmg.outputs.dmg_name }}** below
            2. Open the DMG and drag **Mongo Desktop** to your Applications folder
            3. Launch from Applications

            > **macOS requirement**: macOS 26.0 or later (Apple Silicon)
          files: ${{ steps.dmg.outputs.dmg_path }}
